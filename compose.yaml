services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  ai-service:
    build:
      context: ./ai-service

    restart: unless-stopped

    environment:
      AI_ENVIRONMENT: docker

      AI_OLLAMA_BASE_URL:
        http://host.docker.internal:11434

      AI_OLLAMA_MODEL:
        qwen3.5:9b

      AI_OLLAMA_CONNECT_TIMEOUT: 5
      AI_OLLAMA_READ_TIMEOUT: 120

      AI_OTEL_ENDPOINT: http://otel-collector:4317

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus exporter
    depends_on:
      - tempo
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped


  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped


  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped


  java-app:
    build:
      context: .

    restart: unless-stopped

    ports:
      - "8082:8080"

    environment:

      SPRING_DATASOURCE_URL:
        jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai

      SPRING_DATASOURCE_USERNAME:
        ${MYSQL_USER}

      SPRING_DATASOURCE_PASSWORD:
        ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST:
        redis

      SPRING_DATA_REDIS_PORT:
        6379

      SPRING_RABBITMQ_HOST:
        rabbitmq

      SPRING_RABBITMQ_PORT:
        5672

      SPRING_RABBITMQ_USERNAME:
        ${RABBITMQ_USER}

      SPRING_RABBITMQ_PASSWORD:
        ${RABBITMQ_PASSWORD}

      APP_AI_PYTHON_BASE_URL:
        http://ai-service:8000

      APP_AI_PYTHON_READ_TIMEOUT:
        135s

      MANAGEMENT_OTLP_TRACING_ENDPOINT:
        http://otel-collector:4318/v1/traces

    depends_on:

      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      ai-service:
        condition: service_healthy

      otel-collector:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 15


volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  tempo-data:
  grafana-data:
